[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vela"
version = "0.1.0"
description = "Vela Compiler and Educational Runtime for CS 4031"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vela Team" }
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dev = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
    "hypothesis>=6.80.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vela*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
